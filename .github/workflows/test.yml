name: extension-tests
on:
  push: { branches: [main] }
  schedule: [{ cron: "15 6 * * 1" }]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright==1.63.0 && python -m playwright install --with-deps chromium
      - run: python test_extension.py
